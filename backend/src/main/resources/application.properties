# Spring Boot Application Properties
spring.application.name=opd-backend
server.port=8080

# MySQL Configuration (To connect to MySQL, uncomment below and update password):
# spring.datasource.url=jdbc:mysql://localhost:3306/opd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Embedded Database Setup (For immediate zero-config demo execution)
spring.datasource.url=jdbc:h2:mem:opd_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
